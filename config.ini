[settings]
; 1. Имя анализируемого пакета (Maven, например "org.apache.commons:commons-lang3")
package_name = org.apache.commons:commons-lang3

; 2. URL-адрес репозитория ИЛИ путь к файлу тестового репозитория
repo_url = https://repo1.maven.org/maven2

; 3. Режим работы с тестовым репозиторием
repo_mode = real

; 4. Версия пакета
package_version = 3.14.0

; 5. Имя файла с изображением графа
output_file = graph.svg

; 6. Режим вывода зависимостей в формате ASCII-дерева (вкл/выкл)
ascii_tree = true

; 7. Максимальная глубина анализа зависимостей
max_depth = 5